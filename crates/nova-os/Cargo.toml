[package]
name = "nova-os"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OS plumbing for NovaProxy: command plans, system-proxy control, privileged helper"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
