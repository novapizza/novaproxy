[package]
name = "nova-os"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OS plumbing for NovaProxy: command plans, system-proxy control, privileged helper"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# `getpeereid` for the helper's peer check. Deliberately the only non-pure-Rust
# dependency here: this crate is what runs as root.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Windows is driven through Win32 directly rather than by spawning `reg.exe` and
# `certutil`: each spawn cost a console flash and ~50ms, and the text those tools
# print was never a stable interface. Raw bindings only (no COM, no wrappers),
# already in the tree via tao/wry.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_Rras",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
