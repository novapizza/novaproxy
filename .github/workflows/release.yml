name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    environment: Production

    name: Build and Publish macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is the only place the release version is stated to the outside
      # world, and tauri.conf.json is the only place it is stated to the build.
      # A mismatch ships a dmg whose filename disagrees with its release.
      - name: Check the tag matches tauri.conf.json
        run: |
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$conf" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME says $tag, tauri.conf.json says $conf" >&2
            exit 1
          fi
          echo "version $conf"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Tauri's bundler signs frameworks, externalBin and Contents/MacOS, but
      # NOT what copy_resources() puts in Contents/Resources — see
      # tauri-bundler/src/bundle/macos/app.rs, where the copy_resources() result
      # never reaches sign_paths. nova-helper is a Mach-O executable bundled as
      # a resource, so notarization rejects the whole app unless we sign it
      # ourselves first. Hence our own keychain, before tauri build.
      #
      # Absent the certificate this step is skipped and the build stays
      # unsigned — a missing secret produces an unsigned dmg, not a red run.
      - name: Import signing certificate
        id: cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::warning::CSC_LINK is not set — building unsigned"
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/novaproxy-signing.keychain-db"
          password=$(openssl rand -base64 24)
          echo "::add-mask::$password"
          cert="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERTIFICATE" | base64 -d > "$cert"
          security create-keychain -p "$password" "$keychain"
          # Default is a 5-minute idle lock, which a long cargo build outlives.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          # Without this, codesign gets a keychain prompt it cannot answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          # Prepend, keeping the login keychain reachable.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [[ -z "$identity" ]]; then
            echo "the certificate holds no \"Developer ID Application\" identity" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "signing with $identity"

          echo "signing=true" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # Inside out: sign the helper before tauri build copies it into the
      # bundle. tauri.conf.json's beforeBuildCommand runs this same cargo
      # invocation, where cargo finds the binary fresh and leaves the signature
      # alone. The verify step below is what catches it if that ever stops
      # being true.
      - name: Build and sign the privileged helper
        if: steps.cert.outputs.signing == 'true'
        run: |
          cargo build --release -p nova-helper
          codesign --force --timestamp --options runtime \
            --keychain "$KEYCHAIN" --sign "${{ steps.cert.outputs.identity }}" \
            target/release/nova-helper
          codesign --verify --strict --verbose=2 target/release/nova-helper

      # No --target: that would move the helper to
      # target/aarch64-apple-darwin/release/, where tauri.conf.json's
      # resources entry ("../target/release/nova-helper") no longer finds it.
      # macos-latest is arm64, so the plain build is the arm64 build.
      - name: Build, sign, notarize and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Tauri imports this into a keychain of its own to sign the app
          # bundle and the dmg. APPLE_SIGNING_IDENTITY is deliberately unset:
          # with the certificate present Tauri uses it directly, and naming an
          # identity only adds a string-match that can fail.
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NovaProxy __VERSION__'
          releaseBody: 'Download the dmg below. See the assets for this version.'
          releaseDraft: true
          prerelease: false

      - name: Verify the shipped bundle
        if: steps.cert.outputs.signing == 'true'
        run: |
          app="target/release/bundle/macos/NovaProxy.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # The reason this workflow signs the helper by hand: if this prints
          # "code object is not signed at all", the pre-sign step above was
          # undone and the notarized bundle is broken.
          codesign -dv --verbose=4 "$app/Contents/Resources/nova-helper"
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app"

      - name: Remove the signing keychain
        if: always() && steps.cert.outputs.signing == 'true'
        run: |
          security list-keychains -d user -s \
            $(security list-keychains -d user | tr -d '"' | grep -vF "$KEYCHAIN")
          security delete-keychain "$KEYCHAIN"
