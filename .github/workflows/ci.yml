name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # macOS, not ubuntu: nova-os/nova-core reach for networksetup, the login
    # keychain and a launchd daemon, so most of the Rust tree only compiles and
    # only means anything here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Before cargo: src-tauri/build.rs runs tauri-build, which wants the
      # frontendDist directory (../dist) to already exist.
      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - uses: Swatinem/rust-cache@v2

      - name: Test Rust workspace
        run: cargo test --workspace

      # Informational, like novapad's audit workflow. The tree has never been
      # linted in CI; promote this to `-D warnings` once it is clean.
      - name: Clippy (non-blocking)
        run: cargo clippy --workspace --all-targets || true
